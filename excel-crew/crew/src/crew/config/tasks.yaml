query_maker_task:
  description: "Generate one clear and specific semantic query from the user's question: {question}. Do not generate multiple queries. Avoid redundancy. Ensure the query captures the full row context by unifying all column values into one natural language sentence."
  expected_output: "One optimized query string suitable for semantic search in ChromaDB."
  agent: query_maker

analyze_data_task:
  description: "Analyze only the structured data retrieved from ChromaDB in relation to the user’s question: '{question}'. Identify trends, totals, ratios, or anomalies strictly based on the data provided. Do not use external information."
  expected_output: "A summary of findings including factual trends, totals, patterns, or anomalies relevant to the user's question."
  agent: data_analyzer
  context: [query_maker_task]

report_data_task:
  description: "Use the analyzed insights to write a clear, accurate, and helpful answer to the user's question: '{question}'. The response must be strictly based on the analyzed data, without assumptions or outside knowledge."
  expected_output: "A well-written natural language answer based solely on the analysis results."
  agent: data_reporter
  context: [analyze_data_task]
